[opener]
gimp = [
    { run = 'gimp %s', orphan = true, desc = "GIMP", for = "linux" }
]

[open]
prepend_rules = [
    { mime = "image/*", use = "gimp" },
    { url = "*.{png,jpg,jpeg,webp}", use = "gimp" },
]

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"
