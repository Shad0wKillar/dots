# --- uosc integration (upstream-recommended) ---
# uosc draws its own seek/volume indicators, so the built-in osd bar is redundant
osd-bar=no
# uosc draws its own window border/controls
border=no

# --- performance ---
hwdec=auto-safe
profile=gpu-hq

# --- convenience ---
# resume playback where you left off
save-position-on-quit
# keep the player open on the last frame instead of closing at end of file
keep-open=yes

# --- screenshots ---
screenshot-format=png
screenshot-directory=~/Pictures/mpv-screenshots
screenshot-template="%F-%P"
